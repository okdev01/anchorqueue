[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorqueue"
version = "0.1.0"
description = "Durable single-host job queue with SQLite, leases and bounded retries"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Orçun Kara"}]
dependencies = []

[project.scripts]
anchorqueue = "anchorqueue.__main__:main"

[tool.setuptools.packages.find]
include = ["anchorqueue*"]
